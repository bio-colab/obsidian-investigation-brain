case_id: CASE-TEMPLATE-000
truth_status: probable
canonical_conclusion: "Replace with the calibrated conclusion statement"

evidence:
  - id: EV-001
    title: "Example operational evidence"
    type: physical-evidence
    source_kind: operational
    required: true
    must_have_coc: true
    aliases: ["example knife", "EV-001"]
    summary: "Example physical item from scene"

  - id: EV-002
    title: "Example archival record"
    type: documentary
    source_kind: public-archive
    required: true
    must_have_provenance: true
    aliases: ["archive memo"]
    summary: "Public archive memo"

hypotheses:
  - id: H-PRIMARY
    statement: "Primary working theory of the case"
    kind: primary
    required: true
    expected_support_level: moderate
    expected_counter_themes:
      - "alternative perpetrator"
      - "accidental cause"
    aliases: ["primary theory"]

  - id: H-COUNTER
    statement: "Counter: alternative explanation consistent with some evidence"
    kind: counter
    required: true
    counter_of: H-PRIMARY
    expected_support_level: weak
    aliases: ["counter theory"]

timeline_events:
  - id: T-001
    timestamp: "2000-01-01"
    precision: day-only
    summary: "Index event"
    required: true
    aliases: ["index event"]

contradictions:
  - id: CX-001
    description: "Witness time claim conflicts with digital log"
    aliases: ["time conflict"]
    related_ids: [T-001, EV-001]

missing_evidence:
  - id: GAP-001
    description: "Original lab worksheet not in packet"
    aliases: ["lab worksheet missing"]
    phase_id: P2

forbidden_inferences:
  - id: FI-001
    description: "Must not assert DNA match when packet has no DNA result"
    match_patterns:
      - "DNA match"
      - "DNA confirmed"

forbidden_entities: []
group_entity_only: false

report_must_cite:
  - id: RC-001
    claim: "Index event occurred on the stated date"
    must_link_evidence_ids: [EV-001]

entities:
  - id: PER-001
    name: "Example Person"
    type: person
    role: person-of-interest

readiness_expectations:
  allow_final_report: true
  min_verified_evidence: 1
  require_counters: true
